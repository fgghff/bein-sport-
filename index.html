<!-- تم اختصار الشرح داخل الكود لانه نظيف ومنظم -->

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>شغلني</title>

<style>
body{
margin:0;
font-family:Cairo;
background:#0f2027;
color:white;
}

/* Navbar */
nav{
display:flex;
justify-content:space-between;
padding:15px;
background:#020617;
}

.logo{color:#00ffd5;font-weight:bold}

.btn{
padding:8px 15px;
border:none;
cursor:pointer;
border-radius:6px;
}

.btn-primary{background:#00ffd5;color:black}
.btn-danger{background:red;color:white}

/* Sections */
.section{padding:30px}

.hidden{display:none}

/* Cards */
.card{
background:#1e293b;
padding:15px;
margin:10px 0;
border-radius:10px;
}

/* Profile */
.profile{
background:#020617;
padding:20px;
border-radius:10px;
}
</style>
</head>

<body>

<nav>
<div class="logo">شغلني</div>
<div id="nav"></div>
</nav>

<!-- وظائف -->
<div class="section" id="jobs-section">
<h2>الوظائف</h2>
<div id="jobs"></div>
</div>

<!-- نشر -->
<div class="section" id="post-section">
<h2>نشر وظيفة</h2>
<input id="title" placeholder="اسم الوظيفة">
<input id="company" placeholder="الشركة">
<textarea id="desc" placeholder="الوصف"></textarea>
<button class="btn btn-primary" onclick="addJob()">نشر</button>
</div>

<!-- ملف شخصي -->
<div class="section hidden" id="profile-section">
<h2>ملفي الشخصي</h2>
<div class="profile">
<p>👤 الاسم: <span id="pname"></span></p>
<p>📧 البريد: <span id="pemail"></span></p>
<textarea id="cv" placeholder="اكتب سيرتك"></textarea>
<button class="btn btn-primary" onclick="saveCV()">حفظ</button>
</div>
</div>

<!-- تسجيل -->
<div class="section hidden" id="auth">
<h2 id="authTitle"></h2>
<input id="name" placeholder="الاسم">
<input id="email" placeholder="الايميل">
<input id="pass" type="password" placeholder="كلمة المرور">
<button class="btn btn-primary" onclick="submitAuth()">تنفيذ</button>
</div>

<script>

/* حماية */
document.addEventListener("contextmenu",e=>e.preventDefault());
document.onkeydown=function(e){
if(e.keyCode==123|| (e.ctrlKey && e.shiftKey && e.keyCode==73)) return false;
}

/* بيانات */
let users=JSON.parse(localStorage.getItem("users"))||[];
let jobs=JSON.parse(localStorage.getItem("jobs"))||[];
let current=JSON.parse(localStorage.getItem("current"))||null;
let mode="login";

/* UI */
function renderNav(){
if(current){
nav.innerHTML=`
<button onclick="showProfile()">ملفي</button>
<button onclick="logout()">خروج</button>
`;
}else{
nav.innerHTML=`
<button onclick="openAuth('login')">دخول</button>
<button onclick="openAuth('register')">تسجيل</button>
`;
}
}

/* Auth */
function openAuth(m){
mode=m;
auth.classList.remove("hidden");
authTitle.innerText=m=="login"?"تسجيل دخول":"إنشاء حساب";
}

function submitAuth(){
let n=name.value.trim();
let e=email.value.trim();
let p=pass.value.trim();

if(mode=="register"){
if(users.find(u=>u.email==e)){alert("موجود");return;}
let u={id:Date.now(),name:n,email:e,pass:p,cv:""};
users.push(u);
localStorage.setItem("users",JSON.stringify(users));
current=u;
}else{
let u=users.find(x=>x.email==e && x.pass==p);
if(!u){alert("خطأ");return;}
current=u;
}

localStorage.setItem("current",JSON.stringify(current));
auth.classList.add("hidden");
renderNav();
renderProfile();
}

/* Logout */
function logout(){
localStorage.removeItem("current");
location.reload();
}

/* Profile */
function showProfile(){
profile-section.classList.remove("hidden");
renderProfile();
}

function renderProfile(){
if(!current) return;
pname.innerText=current.name;
pemail.innerText=current.email;
cv.value=current.cv||"";
}

function saveCV(){
current.cv=cv.value;
users=users.map(u=>u.id==current.id?current:u);
localStorage.setItem("users",JSON.stringify(users));
alert("تم الحفظ");
}

/* Jobs */
function addJob(){
if(!current){alert("سجل دخول");return;}

let j={
id:Date.now(),
title:escapeHTML(title.value),
company:escapeHTML(company.value),
desc:escapeHTML(desc.value),
user:current.name
};

jobs.unshift(j);
localStorage.setItem("jobs",JSON.stringify(jobs));
renderJobs();
}

function renderJobs(){
jobsDiv.innerHTML="";
jobs.forEach(j=>{
jobsDiv.innerHTML+=`
<div class="card">
<h3>${j.title}</h3>
<p>${j.company}</p>
<p>${j.desc}</p>
<p>👤 ${j.user}</p>
</div>`;
});
}

const jobsDiv=document.getElementById("jobs");

/* حماية XSS */
function escapeHTML(str){
return str.replace(/[&<>'"]/g,
t=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[t]));
}

/* Init */
renderNav();
renderJobs();
if(current) renderProfile();

</script>

</body>
</html>
