<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شغلني</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Cairo', sans-serif;
    background: linear-gradient(135deg,#1f4037,#99f2c8);
    margin:0;
    color:#fff;
}

nav {
    display:flex;
    justify-content:space-between;
    padding:20px;
    background:rgba(0,0,0,0.3);
}

button {
    padding:8px 15px;
    border:none;
    cursor:pointer;
    border-radius:6px;
}

.container {
    padding:20px;
}

.card {
    background:rgba(255,255,255,0.1);
    padding:15px;
    margin:10px 0;
    border-radius:10px;
}

input, textarea {
    width:100%;
    padding:10px;
    margin:5px 0;
    border:none;
    border-radius:6px;
}

.hidden {display:none;}
</style>
</head>

<body>

<nav>
    <h2>🚀 شغلني</h2>
    <div id="authArea">
        <button onclick="showLogin()">دخول</button>
        <button onclick="showRegister()">تسجيل</button>
    </div>
</nav>

<div class="container">

<!-- تسجيل -->
<div id="register" class="hidden">
    <h3>إنشاء حساب</h3>
    <input id="regUser" placeholder="اسم المستخدم">
    <input id="regPass" type="password" placeholder="كلمة المرور">
    <button onclick="register()">تسجيل</button>
</div>

<!-- تسجيل دخول -->
<div id="login" class="hidden">
    <h3>تسجيل الدخول</h3>
    <input id="logUser" placeholder="اسم المستخدم">
    <input id="logPass" type="password" placeholder="كلمة المرور">
    <button onclick="login()">دخول</button>
</div>

<!-- نشر وظيفة -->
<div id="postJob" class="hidden">
    <h3>نشر وظيفة</h3>
    <input id="jobTitle" placeholder="اسم الوظيفة">
    <textarea id="jobDesc" placeholder="وصف الوظيفة"></textarea>
    <button onclick="addJob()">نشر</button>
</div>

<!-- عرض وظائف -->
<h3>الوظائف</h3>
<div id="jobs"></div>

</div>

<script>

let currentUser = null;

function showLogin(){
    document.getElementById("login").classList.remove("hidden");
    document.getElementById("register").classList.add("hidden");
}

function showRegister(){
    document.getElementById("register").classList.remove("hidden");
    document.getElementById("login").classList.add("hidden");
}

function register(){
    let user = regUser.value;
    let pass = regPass.value;

    let users = JSON.parse(localStorage.getItem("users")||"[]");

    users.push({user,pass,rating:0});
    localStorage.setItem("users",JSON.stringify(users));

    alert("تم التسجيل!");
}

function login(){
    let user = logUser.value;
    let pass = logPass.value;

    let users = JSON.parse(localStorage.getItem("users")||"[]");

    let found = users.find(u=>u.user===user && u.pass===pass);

    if(found){
        currentUser = user;
        document.getElementById("postJob").classList.remove("hidden");
        document.getElementById("authArea").innerHTML = "مرحباً "+user;
    } else {
        alert("خطأ!");
    }
}

function addJob(){
    let title = jobTitle.value;
    let desc = jobDesc.value;

    let jobs = JSON.parse(localStorage.getItem("jobs")||"[]");

    jobs.push({title,desc,user:currentUser,ratings:[]});
    localStorage.setItem("jobs",JSON.stringify(jobs));

    loadJobs();
}

function rate(index,value){
    let jobs = JSON.parse(localStorage.getItem("jobs"));
    jobs[index].ratings.push(value);
    localStorage.setItem("jobs",JSON.stringify(jobs));
    loadJobs();
}

function loadJobs(){
    let jobs = JSON.parse(localStorage.getItem("jobs")||"[]");

    let html="";

    jobs.forEach((job,i)=>{
        let avg = job.ratings.length ? 
            (job.ratings.reduce((a,b)=>a+b)/job.ratings.length).toFixed(1) : "0";

        html+=`
        <div class="card">
            <h4>${job.title}</h4>
            <p>${job.desc}</p>
            <small>بواسطة: ${job.user}</small><br>
            ⭐ ${avg}
            <br>
            <button onclick="rate(${i},5)">👍 تقييم</button>
        </div>`;
    });

    document.getElementById("jobs").innerHTML = html;
}

loadJobs();

</script>

</body>
</html>
