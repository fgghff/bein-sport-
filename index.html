<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>شغلني</title>
<style>
body{
margin:0;
font-family:Tahoma;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
}

header{
display:flex;
justify-content:space-between;
padding:15px;
}

button{
padding:10px 15px;
border:none;
border-radius:8px;
background:#00d4ff;
color:#000;
font-weight:bold;
cursor:pointer;
margin:3px;
}

.container{
padding:20px;
max-width:900px;
margin:auto;
}

input,textarea,select{
width:100%;
padding:12px;
margin:8px 0;
border-radius:10px;
border:none;
}

.card{
background:rgba(255,255,255,0.1);
padding:15px;
border-radius:15px;
margin:10px 0;
}

.deleteBtn{
background:red;
color:white;
float:left;
}

.hidden{display:none}
</style>
</head>

<body>

<header>
<div>
<button onclick="showLogin()">دخول</button>
<button onclick="showRegister()">إنشاء حساب</button>
<button onclick="logout()">خروج</button>
</div>
<h2>شغلني</h2>
</header>

<div class="container">

<!-- تسجيل -->
<div id="registerBox" class="hidden">
<h3>إنشاء حساب</h3>
<input id="regUser" placeholder="اسم المستخدم">
<input id="regPass" type="password" placeholder="كلمة المرور">
<button onclick="register()">إنشاء</button>
</div>

<!-- دخول -->
<div id="loginBox" class="hidden">
<h3>تسجيل دخول</h3>
<input id="logUser" placeholder="اسم المستخدم">
<input id="logPass" type="password" placeholder="كلمة المرور">
<button onclick="login()">دخول</button>
</div>

<!-- لوحة -->
<div id="dashboard" class="hidden">

<h2>لوحة التحكم</h2>

<!-- الملف الشخصي -->
<div class="card">
<h3>ملفي الشخصي (CV)</h3>
<textarea id="cv" placeholder="اكتب خبراتك هنا"></textarea>
<button onclick="saveCV()">حفظ</button>
</div>

<!-- نشر -->
<div class="card">
<h3>نشر وظيفة</h3>
<input id="title" placeholder="عنوان الوظيفة">
<textarea id="desc" placeholder="الوصف"></textarea>

<select id="city">
<option>بغداد</option>
<option>البصرة</option>
<option>الموصل</option>
<option>أربيل</option>
<option>دهوك</option>
<option>كربلاء</option>
<option>النجف</option>
<option>السليمانية</option>
<option>ديالى</option>
<option>الأنبار</option>
<option>واسط</option>
<option>بابل</option>
<option>صلاح الدين</option>
<option>ميسان</option>
<option>ذي قار</option>
<option>المثنى</option>
<option>كركوك</option>
</select>

<button onclick="addJob()">نشر</button>
</div>

</div>

<!-- التصفح -->
<div class="container">
<h2>تصفح الوظائف</h2>

<select id="filter" onchange="showJobs()">
<option value="الكل">الكل</option>
<option>بغداد</option>
<option>البصرة</option>
<option>الموصل</option>
<option>أربيل</option>
<option>دهوك</option>
<option>كربلاء</option>
<option>النجف</option>
<option>السليمانية</option>
<option>ديالى</option>
<option>الأنبار</option>
<option>واسط</option>
<option>بابل</option>
<option>صلاح الدين</option>
<option>ميسان</option>
<option>ذي قار</option>
<option>المثنى</option>
<option>كركوك</option>
</select>

<div id="jobs"></div>
</div>

</div>

<script>

let users = JSON.parse(localStorage.getItem("users")) || [];
let jobs = JSON.parse(localStorage.getItem("jobs")) || [];
let currentUser = localStorage.getItem("currentUser");

if(currentUser){
document.getElementById("dashboard").classList.remove("hidden");
loadCV();
}

function showRegister(){
registerBox.classList.toggle("hidden");
loginBox.classList.add("hidden");
}

function showLogin(){
loginBox.classList.toggle("hidden");
registerBox.classList.add("hidden");
}

function register(){
let u = regUser.value;
let p = regPass.value;

if(!u || !p){alert("املأ البيانات");return;}

if(users.find(x=>x.user==u)){
alert("المستخدم موجود");
return;
}

users.push({user:u,pass:p,cv:""});
localStorage.setItem("users",JSON.stringify(users));
alert("تم إنشاء الحساب");
}

function login(){
let u = logUser.value;
let p = logPass.value;

let user = users.find(x=>x.user==u && x.pass==p);

if(!user){
alert("بيانات خاطئة");
return;
}

localStorage.setItem("currentUser",u);
currentUser=u;

document.getElementById("dashboard").classList.remove("hidden");
loginBox.classList.add("hidden");

loadCV();
}

function logout(){
localStorage.removeItem("currentUser");
location.reload();
}

function saveCV(){
let user = users.find(x=>x.user==currentUser);
user.cv = cv.value;
localStorage.setItem("users",JSON.stringify(users));
alert("تم حفظ CV");
}

function loadCV(){
let user = users.find(x=>x.user==currentUser);
if(user) cv.value = user.cv || "";
}

function addJob(){
let t = title.value;
let d = desc.value;
let c = city.value;

if(!t || !d){alert("املأ البيانات");return;}

jobs.push({
id:Date.now(),
title:t,
desc:d,
city:c,
owner:currentUser
});

localStorage.setItem("jobs",JSON.stringify(jobs));
title.value=""; desc.value="";
showJobs();
}

function deleteJob(id){
jobs = jobs.filter(j=>j.id!==id);
localStorage.setItem("jobs",JSON.stringify(jobs));
showJobs();
}

function showJobs(){
let f = filter.value;
jobsDiv.innerHTML="";

jobs.filter(j=> f=="الكل" || j.city==f)
.forEach(j=>{

let div=document.createElement("div");
div.className="card";

div.innerHTML=`
<h3>${j.title}</h3>
<p>${j.desc}</p>
<p>${j.city}</p>
${j.owner==currentUser ? `<button class="deleteBtn" onclick="deleteJob(${j.id})">حذف</button>`:""}
`;

jobsDiv.appendChild(div);
});
}

showJobs();

</script>

</body>
</html>
