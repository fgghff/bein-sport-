<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شغلني</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Cairo', sans-serif;
    margin:0;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:#fff;
}
nav {
    display:flex;
    justify-content:space-between;
    padding:15px 30px;
    background:rgba(255,255,255,0.05);
}
button {
    padding:8px 15px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    background:#00ffd5;
}
.container {padding:20px;}
.card {
    background:rgba(255,255,255,0.08);
    padding:15px;
    margin:10px 0;
    border-radius:10px;
}
input, select, textarea {
    width:100%;
    padding:10px;
    margin:5px 0;
    border-radius:6px;
    border:none;
}
.hidden {display:none;}
</style>
</head>

<body>

<nav>
    <h2>🚀 شغلني</h2>
    <div id="navAuth">
        <button onclick="showLogin()">دخول</button>
        <button onclick="showRegister()">تسجيل</button>
    </div>
</nav>

<div class="container">

<div id="register" class="hidden card">
    <h3>إنشاء حساب</h3>
    <input id="regUser" placeholder="اسم المستخدم">
    <input id="regPass" type="password" placeholder="كلمة المرور">
    <select id="regType">
        <option value="worker">عامل</option>
        <option value="employer">صاحب عمل</option>
    </select>
    <button onclick="register()">تسجيل</button>
</div>

<div id="login" class="hidden card">
    <h3>تسجيل الدخول</h3>
    <input id="logUser" placeholder="اسم المستخدم">
    <input id="logPass" type="password" placeholder="كلمة المرور">
    <button onclick="login()">دخول</button>
</div>

<div id="dashboard" class="hidden">
    <h3 id="welcome"></h3>

    <div id="postJobBox" class="card hidden">
        <h4>نشر وظيفة</h4>
        <input id="jobTitle" placeholder="اسم الوظيفة">
        <textarea id="jobDesc" placeholder="الوصف"></textarea>
        <button onclick="addJob()">نشر</button>
    </div>

    <h3>الوظائف</h3>
    <div id="jobs"></div>

    <button onclick="logout()">تسجيل خروج</button>
</div>

</div>

<script>

// 🔒 حماية أساسية
document.addEventListener("contextmenu", e => e.preventDefault());
document.onkeydown = function(e){
    if(e.keyCode == 123) return false;
    if(e.ctrlKey && e.shiftKey && e.keyCode == 73) return false;
};

// كشف DevTools
setInterval(()=>{
    if(window.outerWidth - window.innerWidth > 200){
        document.body.innerHTML = "🚫 تم حظر الوصول";
    }
},1000);

let currentUser = null;

// تحميل الجلسة
window.onload = function(){
    let saved = sessionStorage.getItem("user");
    if(saved){
        currentUser = JSON.parse(saved);
        startApp();
    }
};

function showLogin(){
    login.classList.remove("hidden");
    register.classList.add("hidden");
}
function showRegister(){
    register.classList.remove("hidden");
    login.classList.add("hidden");
}

// تسجيل
function register(){
    let users = JSON.parse(localStorage.getItem("users")||"[]");

    let user = {
        name: regUser.value,
        pass: btoa(regPass.value),
        type: regType.value
    };

    users.push(user);
    localStorage.setItem("users", JSON.stringify(users));

    alert("تم التسجيل");
}

// تسجيل دخول
function login(){
    let users = JSON.parse(localStorage.getItem("users")||"[]");

    let user = users.find(u => 
        u.name === logUser.value &&
        u.pass === btoa(logPass.value)
    );

    if(user){
        currentUser = user;
        sessionStorage.setItem("user", JSON.stringify(user));
        startApp();
    }else{
        alert("خطأ في البيانات");
    }
}

// بدء النظام
function startApp(){
    document.getElementById("login").classList.add("hidden");
    document.getElementById("register").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");

    document.getElementById("welcome").innerText = "اهلاً " + currentUser.name;

    navAuth.innerHTML = "👤 " + currentUser.name;

    if(currentUser.type === "employer"){
        postJobBox.classList.remove("hidden");
    }

    loadJobs();
}

// نشر وظيفة
function addJob(){
    let jobs = JSON.parse(localStorage.getItem("jobs")||"[]");

    jobs.push({
        title: jobTitle.value,
        desc: jobDesc.value,
        owner: currentUser.name
    });

    localStorage.setItem("jobs", JSON.stringify(jobs));
    loadJobs();
}

// عرض الوظائف
function loadJobs(){
    let jobs = JSON.parse(localStorage.getItem("jobs")||"[]");

    jobsDiv.innerHTML = "";

    jobs.forEach(job=>{
        jobsDiv.innerHTML += `
        <div class="card">
            <h4>${job.title}</h4>
            <p>${job.desc}</p>
            <small>بواسطة: ${job.owner}</small>
        </div>
        `;
    });
}

// خروج
function logout(){
    sessionStorage.removeItem("user");
    location.reload();
}

</script>

</body>
</html>
