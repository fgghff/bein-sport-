<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شغلني | منصة التوظيف</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Cairo",sans-serif}
body{background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);color:#fff}
.container{width:90%;margin:auto;padding:20px}
nav{display:flex;justify-content:space-between;align-items:center;padding:15px 0}
nav h1{color:#00eaff}
nav button{padding:8px 15px;border:none;border-radius:8px;cursor:pointer;background:#00eaff;color:#000}

.section{display:none}
.active{display:block}

input,select,textarea{
width:100%;padding:10px;margin:10px 0;border:none;border-radius:8px
}

.card{
background:rgba(255,255,255,0.1);
padding:15px;
margin:10px 0;
border-radius:12px;
backdrop-filter:blur(10px)
}

.jobs{margin-top:20px}
</style></head><body><div class="container"><nav>
<h1>شغلني</h1>
<div>
<button onclick="showSection('login')">دخول</button>
<button onclick="showSection('register')">إنشاء حساب</button>
<button onclick="logout()">خروج</button>
</div>
</nav><!-- تسجيل --><div id="register" class="section active">
<h2>إنشاء حساب</h2>
<input id="regName" placeholder="الاسم">
<input id="regEmail" placeholder="البريد">
<input id="regPass" type="password" placeholder="كلمة المرور">
<button onclick="register()">تسجيل</button>
</div><!-- دخول --><div id="login" class="section">
<h2>تسجيل الدخول</h2>
<input id="logEmail" placeholder="البريد">
<input id="logPass" type="password" placeholder="كلمة المرور">
<button onclick="login()">دخول</button>
</div><!-- لوحة --><div id="dashboard" class="section">
<h2>لوحة التحكم</h2><h3>نشر وظيفة</h3>
<input id="jobTitle" placeholder="عنوان الوظيفة">
<textarea id="jobDesc" placeholder="وصف"></textarea><select id="jobProvince">
<option value="">اختر المحافظة</option>
<option>بغداد</option>
<option>البصرة</option>
<option>نينوى</option>
<option>أربيل</option>
<option>السليمانية</option>
<option>كركوك</option>
<option>النجف</option>
<option>كربلاء</option>
<option>الأنبار</option>
<option>ديالى</option>
<option>ذي قار</option>
<option>المثنى</option>
<option>واسط</option>
<option>بابل</option>
<option>صلاح الدين</option>
<option>ميسان</option>
<option>القادسية</option>
</select><button onclick="addJob()">نشر</button>

<hr><h3>تصفح الوظائف</h3><select id="filterProvince" onchange="renderJobs()">
<option value="all">كل المحافظات</option>
<option>بغداد</option>
<option>البصرة</option>
<option>نينوى</option>
<option>أربيل</option>
<option>السليمانية</option>
<option>كركوك</option>
<option>النجف</option>
<option>كربلاء</option>
<option>الأنبار</option>
<option>ديالى</option>
<option>ذي قار</option>
<option>المثنى</option>
<option>واسط</option>
<option>بابل</option>
<option>صلاح الدين</option>
<option>ميسان</option>
<option>القادسية</option>
</select><div id="jobs" class="jobs"></div></div></div><script>

// إدارة الأقسام
function showSection(id){
document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"))
document.getElementById(id).classList.add("active")
}

// تسجيل
function register(){
let users=JSON.parse(localStorage.getItem("users")||"[]")

let user={
name:regName.value,
email:regEmail.value,
pass:regPass.value
}

users.push(user)
localStorage.setItem("users",JSON.stringify(users))
alert("تم إنشاء الحساب")
showSection("login")
}

// دخول
function login(){
let users=JSON.parse(localStorage.getItem("users")||"[]")

let user=users.find(u=>u.email===logEmail.value && u.pass===logPass.value)

if(user){
sessionStorage.setItem("user",JSON.stringify(user))
showSection("dashboard")
renderJobs()
}else{
alert("بيانات خاطئة")
}
}

// خروج
function logout(){
sessionStorage.removeItem("user")
showSection("login")
}

// إضافة وظيفة
function addJob(){
let jobs=JSON.parse(localStorage.getItem("jobs")||"[]")

let job={
title:jobTitle.value,
desc:jobDesc.value,
province:jobProvince.value
}

jobs.push(job)
localStorage.setItem("jobs",JSON.stringify(jobs))

renderJobs()
}

// عرض وظائف
function renderJobs(){
let jobs=JSON.parse(localStorage.getItem("jobs")||"[]")
let filter=filterProvince.value

let html=""

jobs.forEach(j=>{
if(filter==="all" || j.province===filter){
html+=`
<div class="card">
<h3>${j.title}</h3>
<p>${j.desc}</p>
<p>📍 ${j.province}</p>
</div>
`
}
})

document.getElementById("jobs").innerHTML=html
}

// تحميل تلقائي
if(sessionStorage.getItem("user")){
showSection("dashboard")
renderJobs()
}

</script></body>
</html>
