<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شغلني</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Cairo', sans-serif;
    margin:0;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:#fff;
}

nav {
    display:flex;
    justify-content:space-between;
    padding:15px 30px;
    background:rgba(255,255,255,0.05);
}

button {
    padding:8px 15px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    background:#00ffd5;
}

.container {padding:20px;}

.card {
    background:rgba(255,255,255,0.08);
    padding:15px;
    margin:10px 0;
    border-radius:10px;
}

input, textarea {
    width:100%;
    padding:10px;
    margin:5px 0;
    border-radius:6px;
    border:none;
}

.hidden {display:none;}
.job {background:rgba(255,255,255,0.1); padding:10px; margin:10px 0; border-radius:8px;}
</style>
</head>

<body>

<nav>
    <h2>🚀 شغلني</h2>
    <div id="navAuth">
        <button onclick="showLogin()">دخول</button>
        <button onclick="showRegister()">تسجيل</button>
    </div>
</nav>

<div class="container">

<!-- تسجيل -->
<div id="register" class="hidden card">
    <h3>إنشاء حساب</h3>
    <input id="regUser" placeholder="اسم المستخدم">
    <input id="regPass" type="password" placeholder="كلمة المرور">
    <button onclick="register()">تسجيل</button>
</div>

<!-- تسجيل دخول -->
<div id="login" class="hidden card">
    <h3>تسجيل الدخول</h3>
    <input id="logUser" placeholder="اسم المستخدم">
    <input id="logPass" type="password" placeholder="كلمة المرور">
    <button onclick="login()">دخول</button>
</div>

<!-- لوحة التحكم -->
<div id="dashboard" class="hidden">

    <h3 id="welcome"></h3>

    <!-- ملف شخصي -->
    <div class="card">
        <h4>👤 الملف الشخصي</h4>
        <input id="profileName" placeholder="اسمك الكامل">
        <input id="profileSkill" placeholder="مهاراتك">
        <textarea id="profileCV" placeholder="اكتب سيرتك الذاتية"></textarea>
        <button onclick="saveProfile()">حفظ الملف</button>
    </div>

    <!-- نشر وظيفة -->
    <div class="card">
        <h4>📢 نشر وظيفة</h4>
        <input id="jobTitle" placeholder="اسم الوظيفة">
        <textarea id="jobDesc" placeholder="تفاصيل العمل"></textarea>
        <button onclick="addJob()">نشر</button>
    </div>

    <!-- عرض الوظائف -->
    <div class="card">
        <h4>💼 الوظائف</h4>
        <div id="jobs"></div>
    </div>

    <button onclick="logout()">تسجيل خروج</button>
</div>

</div>

<script>

let currentUser = null;

/* تحميل الجلسة */
window.onload = function(){
    let saved = localStorage.getItem("currentUser");
    if(saved){
        currentUser = saved;
        startApp();
    }
}

/* عرض */
function showLogin(){
    document.getElementById("login").classList.remove("hidden");
    document.getElementById("register").classList.add("hidden");
}

function showRegister(){
    document.getElementById("register").classList.remove("hidden");
    document.getElementById("login").classList.add("hidden");
}

/* تسجيل */
function register(){
    let user = regUser.value.trim();
    let pass = regPass.value.trim();

    if(!user || !pass){
        alert("املأ الحقول");
        return;
    }

    let users = JSON.parse(localStorage.getItem("users")||"{}");

    if(users[user]){
        alert("المستخدم موجود");
        return;
    }

    users[user] = {password: pass};
    localStorage.setItem("users", JSON.stringify(users));

    alert("تم التسجيل بنجاح");
}

/* تسجيل دخول */
function login(){
    let user = logUser.value.trim();
    let pass = logPass.value.trim();

    let users = JSON.parse(localStorage.getItem("users")||"{}");

    if(users[user] && users[user].password === pass){
        currentUser = user;
        localStorage.setItem("currentUser", user);
        startApp();
    } else {
        alert("بيانات خاطئة");
    }
}

/* بدء */
function startApp(){
    document.getElementById("login").classList.add("hidden");
    document.getElementById("register").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");

    document.getElementById("welcome").innerText = "مرحباً " + currentUser;

    loadProfile();
    loadJobs();
}

/* خروج */
function logout(){
    localStorage.removeItem("currentUser");
    location.reload();
}

/* حفظ CV */
function saveProfile(){
    let profiles = JSON.parse(localStorage.getItem("profiles")||"{}");

    profiles[currentUser] = {
        name: profileName.value,
        skill: profileSkill.value,
        cv: profileCV.value
    };

    localStorage.setItem("profiles", JSON.stringify(profiles));
    alert("تم حفظ السيرة الذاتية");
}

/* تحميل CV */
function loadProfile(){
    let profiles = JSON.parse(localStorage.getItem("profiles")||"{}");

    if(profiles[currentUser]){
        profileName.value = profiles[currentUser].name || "";
        profileSkill.value = profiles[currentUser].skill || "";
        profileCV.value = profiles[currentUser].cv || "";
    }
}

/* نشر وظيفة */
function addJob(){
    let jobs = JSON.parse(localStorage.getItem("jobs")||"[]");

    jobs.push({
        title: jobTitle.value,
        desc: jobDesc.value,
        owner: currentUser
    });

    localStorage.setItem("jobs", JSON.stringify(jobs));
    loadJobs();
}

/* عرض وظائف */
function loadJobs(){
    let jobs = JSON.parse(localStorage.getItem("jobs")||"[]");

    let jobsDiv = document.getElementById("jobs");
    jobsDiv.innerHTML = "";

    jobs.forEach(job=>{
        jobsDiv.innerHTML += `
        <div class="job">
            <h4>${job.title}</h4>
            <p>${job.desc}</p>
            <small>👤 ${job.owner}</small>
        </div>
        `;
    });
}

</script>

</body>
</html>
