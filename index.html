<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة شغلني</title>

<style>
body {
    margin:0;
    font-family:Tahoma;
    background:#0f172a;
    color:#fff;
}

header {
    background:#020617;
    padding:15px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.container {
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.card {
    background:#1e293b;
    padding:20px;
    margin:10px 0;
    border-radius:10px;
}

input, textarea {
    width:100%;
    padding:10px;
    margin:5px 0;
    border:none;
    border-radius:5px;
}

button {
    background:#3b82f6;
    color:#fff;
    border:none;
    padding:10px;
    width:100%;
    border-radius:5px;
    cursor:pointer;
}

button:hover {
    background:#2563eb;
}

.hidden { display:none; }

.job {
    background:#334155;
    padding:10px;
    margin:10px 0;
    border-radius:8px;
}

.rating span {
    cursor:pointer;
    font-size:20px;
}
</style>
</head>

<body>

<header>🚀 منصة شغلني</header>

<div class="container">

<!-- تسجيل -->
<div id="authBox" class="card">
    <h3>تسجيل / دخول</h3>
    <input id="username" placeholder="اسم المستخدم">
    <input id="password" type="password" placeholder="كلمة المرور">
    <button onclick="register()">تسجيل حساب</button>
    <button onclick="login()">تسجيل دخول</button>
</div>

<!-- المنصة -->
<div id="app" class="hidden">

    <div class="card">
        <h3>👋 أهلاً <span id="userDisplay"></span></h3>
        <button onclick="logout()">تسجيل خروج</button>
    </div>

    <div class="card">
        <h3>📢 نشر وظيفة</h3>
        <input id="jobTitle" placeholder="عنوان الوظيفة">
        <textarea id="jobDesc" placeholder="وصف الوظيفة"></textarea>
        <button onclick="addJob()">نشر</button>
    </div>

    <div class="card">
        <h3>💼 الوظائف</h3>
        <div id="jobs"></div>
    </div>

</div>

</div>

<script>

// منع كليك يمين (حماية بسيطة)
document.addEventListener("contextmenu", e => e.preventDefault());

// بيانات
let users = JSON.parse(localStorage.getItem("users")) || {};
let jobs = JSON.parse(localStorage.getItem("jobs")) || [];
let currentUser = localStorage.getItem("currentUser");

// تحميل الحالة
window.onload = function(){
    if(currentUser){
        showApp();
    }
}

// تسجيل
function register(){
    let u = username.value.trim();
    let p = password.value.trim();

    if(!u || !p){
        alert("املأ الحقول");
        return;
    }

    if(users[u]){
        alert("المستخدم موجود");
        return;
    }

    users[u] = {password:p, rating:0, votes:0};
    localStorage.setItem("users", JSON.stringify(users));

    alert("تم التسجيل بنجاح");
}

// دخول
function login(){
    let u = username.value.trim();
    let p = password.value.trim();

    if(users[u] && users[u].password === p){
        currentUser = u;
        localStorage.setItem("currentUser", u);

        showApp(); // ✅ الحل هنا
    } else {
        alert("بيانات خاطئة");
    }
}

// عرض المنصة
function showApp(){
    authBox.classList.add("hidden");
    app.classList.remove("hidden");
    userDisplay.innerText = currentUser;
    renderJobs();
}

// خروج
function logout(){
    localStorage.removeItem("currentUser");
    location.reload();
}

// نشر وظيفة
function addJob(){
    let title = jobTitle.value.trim();
    let desc = jobDesc.value.trim();

    if(!title || !desc){
        alert("املأ البيانات");
        return;
    }

    jobs.push({
        title,
        desc,
        user: currentUser,
        ratings: []
    });

    localStorage.setItem("jobs", JSON.stringify(jobs));

    jobTitle.value = "";
    jobDesc.value = "";

    renderJobs();
}

// عرض الوظائف
function renderJobs(){
    jobsDiv = document.getElementById("jobs");
    jobsDiv.innerHTML = "";

    jobs.forEach((job, index) => {

        let avg = job.ratings.length
            ? (job.ratings.reduce((a,b)=>a+b)/job.ratings.length).toFixed(1)
            : "لا يوجد";

        jobsDiv.innerHTML += `
        <div class="job">
            <h4>${job.title}</h4>
            <p>${job.desc}</p>
            <small>👤 ${job.user}</small>
            <p>⭐ التقييم: ${avg}</p>

            <div class="rating">
                ${[1,2,3,4,5].map(star=>`<span onclick="rate(${index},${star})">⭐</span>`).join("")}
            </div>
        </div>`;
    });
}

// تقييم
function rate(index, value){
    jobs[index].ratings.push(value);
    localStorage.setItem("jobs", JSON.stringify(jobs));
    renderJobs();
}

</script>

</body>
</html>
